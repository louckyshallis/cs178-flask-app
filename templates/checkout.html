<!DOCTYPE html>
<html lang="en">
<head>
    <title>Checkout Summary</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2 class="mt-5">Checkout Summary</h2>

        <table class="table table-bordered table-striped mt-3">
            <thead class="thead-dark">
                <tr>
                    <th>Description</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.description }}</td>
                    <td>${{ item.price }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <h3 class="mt-4 font-weight-bold">
            Total Paid: ${{ "%.2f"|format(total) }}
        </h3>

        <div class="mt-4">
            <div class="alert alert-success">
                Thank you for your purchase! Your cart has been cleared.
            </div>
            <a href="{{ url_for('home') }}" class="btn btn-primary">Return Home</a>
        </div>
    </div>
</body>
</html>
